name: Autenticação
description: |-

  Login por e-mail e senha, devolvendo um token Sanctum. O token vai no header
  `Authorization: Bearer <token>` de toda rota autenticada — e é dele que o
  sistema descobre a instituição do usuário, nunca de um parâmetro do cliente.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/login
    metadata:
      custom: []
      groupName: Autenticação
      groupDescription: |-

        Login por e-mail e senha, devolvendo um token Sanctum. O token vai no header
        `Authorization: Bearer <token>` de toda rota autenticada — e é dele que o
        sistema descobre a instituição do usuário, nunca de um parâmetro do cliente.
      subgroup: ''
      subgroupDescription: ''
      title: Entrar
      description: |-
        Autentica e devolve o token. O e-mail é único **por instituição**: se o
        mesmo endereço existir em mais de uma, responde 422 pedindo `entity_id`
        em vez de escolher uma.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'E-mail institucional.'
        required: true
        example: aluno@alunos.utfpr.edu.br
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'A senha.'
        required: true
        example: campusos
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      entity_id:
        custom: []
        name: entity_id
        description: 'Só quando o e-mail existe em mais de uma instituição.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      device:
        custom: []
        name: device
        description: 'Rótulo do token, para revogar só este dispositivo depois.'
        required: false
        example: iphone-felipe
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: aluno@alunos.utfpr.edu.br
      password: campusos
      entity_id: null
      device: iphone-felipe
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":{"id":"01a0…","name":"Felipe Kurt Pohling","email":"aluno@alunos.utfpr.edu.br","role":"student","role_label":"Estudante","registration_number":"2567857","entity_id":"01a0…","enabled_modules":[]},"token":"1|abc…"}'
        headers: []
        description: sucesso
      -
        custom: []
        status: 422
        content: '{"message":"Credenciais inválidas.","errors":{"email":["Credenciais inválidas."]}}'
        headers: []
        description: 'credenciais inválidas'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/signup
    metadata:
      custom: []
      groupName: Autenticação
      groupDescription: |-

        Login por e-mail e senha, devolvendo um token Sanctum. O token vai no header
        `Authorization: Bearer <token>` de toda rota autenticada — e é dele que o
        sistema descobre a instituição do usuário, nunca de um parâmetro do cliente.
      subgroup: ''
      subgroupDescription: ''
      title: 'Cadastrar (aluno)'
      description: |-
        Cadastro livre — sem escolher universidade numa lista. A instituição é
        resolvida pelo **domínio do e-mail**; sem um domínio habilitado para
        aquele endereço, o cadastro é recusado. Devolve o token **imediatamente**
        (acesso já liberado) e dispara um e-mail com um código de 6 dígitos para
        confirmar o endereço — que não bloqueia nada, é só a camada de segurança.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: 'Nome completo.'
        required: true
        example: 'Felipe Kurt Pohling'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      email:
        custom: []
        name: email
        description: 'E-mail institucional do aluno.'
        required: true
        example: aluno@alunos.utfpr.edu.br
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Mínimo 8 caracteres.'
        required: true
        example: senha-forte-123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password_confirmation:
        custom: []
        name: password_confirmation
        description: 'Repita a senha.'
        required: true
        example: senha-forte-123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      device:
        custom: []
        name: device
        description: 'Rótulo do token.'
        required: false
        example: iphone-felipe
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: 'Felipe Kurt Pohling'
      email: aluno@alunos.utfpr.edu.br
      password: senha-forte-123
      password_confirmation: senha-forte-123
      device: iphone-felipe
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"data":{"id":"01a0…","name":"Felipe Kurt Pohling","email":"aluno@alunos.utfpr.edu.br","role":"student","email_verified":false},"token":"1|abc…"}'
        headers: []
        description: cadastrado
      -
        custom: []
        status: 422
        content: '{"message":"Use seu e-mail institucional — este domínio não está habilitado para cadastro.","errors":{"email":["Use seu e-mail institucional — este domínio não está habilitado para cadastro."]}}'
        headers: []
        description: 'domínio não habilitado'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
