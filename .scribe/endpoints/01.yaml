name: 'Jornada acadêmica'
description: |-

  A progressão da graduação do aluno autenticado — o endpoint que sozinho
  desenha a tela principal do produto.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/me/progress
    metadata:
      custom: []
      groupName: 'Jornada acadêmica'
      groupDescription: |-

        A progressão da graduação do aluno autenticado — o endpoint que sozinho
        desenha a tela principal do produto.
      subgroup: ''
      subgroupDescription: ''
      title: 'Minha progressão'
      description: |-
        Quanto falta para formar, por faixa de carga horária, com o que ainda
        está pendente e a previsão de formatura pelo ritmo **real** do aluno.

        `overall.required_hours` é **calculado** — obrigatórias + optativas +
        extensão autônoma — e `extension.counts_in_total` é `false` de propósito:
        a carga extensionista exigida pelo curso mora *dentro* das disciplinas e
        é verificada em paralelo. Somá-la inventaria horas que o aluno não
        precisa cursar.
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"message":"Unauthenticated."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          access-control-allow-origin: '*'
        description: null
      -
        custom: []
        status: 404
        content: '{"message":"Você ainda não tem vínculo acadêmico. Envie seu histórico escolar."}'
        headers: []
        description: 'sem vínculo'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
