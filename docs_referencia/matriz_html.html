  function AjaxSelecionaCurso(linha) {

        +"&p_alcuordemnr=" +escape(jsCursos[linha-1].alcuordemnr)
  div = "div_CarregaAjaxMenu";
  reqAjaxPost(url, param, div);
  }

  function AjaxFrameBiblioteca() {
    if (document.getElementById('dv_Portal_biblio')) {
      document.getElementById('dv_Portal_biblio').setAttribute("onclick","");
    }
    document.getElementById('if_navega').src='mpMinhaBiblioteca.inicio';
  }

  function callbackiframe() {
    if (document.getElementById('dv_Portal_biblio')) {
      //console.log("terwerwer");
      document.getElementById('dv_Portal_biblio').setAttribute("onclick","AjaxFrameBiblioteca();");
    }
  }

      .modal {
        display: none; 
        position: fixed;  /* fixa na tela, mesmo ao rolar */
        z-index: 9999;    /* muito alto, garante prioridade */
        top: 0;
        left: 0;
        width: 100%; 
        height: 100%; 
        background-color: rgba(0,0,0,0.5); /* semitransparente */
        display: flex;
        justify-content: center; /* centraliza horizontal */

      }

      /* Conteúdo do modal */
      .modal-content {
        position: relative;

        padding: 20px;
        border-radius: 8px;
